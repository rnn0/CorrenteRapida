name: Compilar

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Compilar
        run: dotnet build CorrenteRapida.csproj -c Release
      - name: Gerar SHA-256 (o atualizador do mod confere antes de instalar)
        run: sha256sum bin/Release/CorrenteRapida.dll | cut -d' ' -f1 > CorrenteRapida.dll.sha256
      - name: Montar pacote
        run: |
          mkdir pacote
          cp bin/Release/CorrenteRapida.dll icon.png manifest.json README.md pacote/
          cd pacote && zip -r ../CorrenteRapida.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CorrenteRapida
          path: |
            bin/Release/CorrenteRapida.dll
            CorrenteRapida.dll.sha256
            CorrenteRapida.zip
      - name: Anexar arquivos na release (tag v* ou release publicada)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/CorrenteRapida.dll
            CorrenteRapida.dll.sha256
            CorrenteRapida.zip
