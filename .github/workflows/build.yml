name: Compilar

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Compilar
        run: dotnet build CorrenteRapida.csproj -c Release
      - name: Montar pacote
        run: |
          mkdir pacote
          cp bin/Release/CorrenteRapida.dll icon.png manifest.json README.md pacote/
          cd pacote && zip -r ../CorrenteRapida.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CorrenteRapida
          path: |
            bin/Release/CorrenteRapida.dll
            CorrenteRapida.zip
      - name: Publicar release (quando for uma tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/CorrenteRapida.dll
            CorrenteRapida.zip
